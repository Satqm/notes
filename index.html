<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audit Notes — Study Companion</title>
<style>
  /* ==================== THEME TOKENS ==================== */
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    --font-serif: "Iowan Old Style", "Charter", Georgia, serif;
    --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
    --radius: 12px;
    --radius-sm: 8px;
    --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
    --sidebar-w: 340px;
    --header-h: 64px;
  }

  [data-theme="dark"] {
    --bg: #0b1020;
    --bg-2: #0f1528;
    --bg-3: #151c33;
    --panel: #10172b;
    --border: #1f2947;
    --border-2: #2a3759;
    --fg: #e6ebff;
    --fg-2: #a5b0d0;
    --fg-3: #6b7796;
    --accent: #6ea8fe;
    --accent-2: #8b5cf6;
    --accent-fg: #04122b;
    --red: #ff6b6b;
    --blue: #6ea8fe;
    --green: #4ade80;
    --amber: #fbbf24;
    --shadow: 0 20px 60px -20px rgba(0,0,0,0.7);
    --code-bg: #0a0f20;
    --scroll-thumb: #2a3759;
  }

  [data-theme="light"] {
    --bg: #f6f7fb;
    --bg-2: #ffffff;
    --bg-3: #eef1f8;
    --panel: #ffffff;
    --border: #e2e6f0;
    --border-2: #cbd2e3;
    --fg: #131a2c;
    --fg-2: #4a5573;
    --fg-3: #8b93ad;
    --accent: #2563eb;
    --accent-2: #7c3aed;
    --accent-fg: #ffffff;
    --red: #dc2626;
    --blue: #2563eb;
    --green: #059669;
    --amber: #d97706;
    --shadow: 0 20px 60px -30px rgba(15,23,42,0.25);
    --code-bg: #f1f3f9;
    --scroll-thumb: #cbd2e3;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 20px); }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 15.5px;
    line-height: 1.7;
    color: var(--fg);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    transition: background var(--transition), color var(--transition);
    overflow-x: hidden;
  }

  /* ==================== TOP PROGRESS BAR ==================== */
  #progress-bar {
    position: fixed; top: 0; left: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    width: 0%; z-index: 9999;
    transition: width 100ms linear;
    box-shadow: 0 0 20px var(--accent);
  }

  /* ==================== HEADER ==================== */
  header.topbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--header-h);
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
    z-index: 1000;
    display: flex; align-items: center;
    padding: 0 20px; gap: 14px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 15px; letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .brand-logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    color: white; font-weight: 800; font-size: 15px;
    box-shadow: 0 4px 14px -4px var(--accent);
  }
  .brand-title { display: flex; flex-direction: column; line-height: 1.1; }
  .brand-title small { font-weight: 500; font-size: 10.5px; color: var(--fg-3); letter-spacing: 0.06em; text-transform: uppercase; }

  .search-wrap {
    flex: 1; max-width: 520px; margin: 0 auto; position: relative;
  }
  .search-wrap input {
    width: 100%;
    height: 40px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--fg);
    padding: 0 40px 0 42px;
    font-family: inherit; font-size: 14px;
    transition: border-color var(--transition), background var(--transition);
  }
  .search-wrap input::placeholder { color: var(--fg-3); }
  .search-wrap input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--bg-2);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  .search-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--fg-3); pointer-events: none;
  }
  .kbd {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    font-family: var(--font-mono); font-size: 10.5px;
    background: var(--panel); border: 1px solid var(--border);
    padding: 2px 7px; border-radius: 6px; color: var(--fg-3);
    pointer-events: none;
  }

  .topbar-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--bg-3); border: 1px solid var(--border);
    color: var(--fg); cursor: pointer;
    display: grid; place-items: center;
    transition: all var(--transition);
  }
  .icon-btn:hover { background: var(--panel); border-color: var(--border-2); transform: translateY(-1px); }
  .icon-btn:active { transform: translateY(0); }

  .menu-toggle { display: none; }

  /* ==================== LAYOUT ==================== */
  .layout {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    min-height: 100vh;
    padding-top: var(--header-h);
  }

  /* ==================== SIDEBAR ==================== */
  aside.sidebar {
    position: sticky; top: var(--header-h);
    height: calc(100vh - var(--header-h));
    overflow-y: auto;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 14px 40px;
    scrollbar-width: thin;
    scrollbar-color: var(--scroll-thumb) transparent;
  }
  aside.sidebar::-webkit-scrollbar { width: 8px; }
  aside.sidebar::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb); border-radius: 4px;
    border: 2px solid var(--panel);
  }
  aside.sidebar::-webkit-scrollbar-thumb:hover { background: var(--border-2); }

  .sidebar-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-bottom: 18px;
  }
  .stat {
    background: var(--bg-3); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 8px; text-align: center;
  }
  .stat-num { font-size: 18px; font-weight: 700; color: var(--accent); display: block; line-height: 1; }
  .stat-label { font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }

  .sidebar-heading {
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--fg-3);
    padding: 8px 10px; margin: 4px 0;
  }

  .ch-group { margin-bottom: 2px; }
  .ch-head {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; border-radius: var(--radius-sm);
    cursor: pointer; user-select: none;
    font-size: 13px; font-weight: 600;
    color: var(--fg-2);
    transition: all var(--transition);
    border: 1px solid transparent;
  }
  .ch-head:hover { background: var(--bg-3); color: var(--fg); }
  .ch-head .caret {
    transition: transform var(--transition);
    color: var(--fg-3); flex-shrink: 0;
  }
  .ch-group.open > .ch-head .caret { transform: rotate(90deg); }
  .ch-head .ch-num {
    font-family: var(--font-mono); font-size: 11px;
    background: var(--bg-3); color: var(--accent);
    padding: 2px 7px; border-radius: 5px; font-weight: 700;
    flex-shrink: 0;
  }
  .ch-head .ch-title {
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ch-head.active { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--fg); }

  .ch-body { display: none; padding-left: 8px; }
  .ch-group.open > .ch-body { display: block; }

  .tp-item {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; margin: 1px 0;
    border-radius: 6px;
    font-size: 12.5px; color: var(--fg-2);
    cursor: pointer;
    text-decoration: none;
    transition: all var(--transition);
    border-left: 2px solid transparent;
  }
  .tp-item:hover { background: var(--bg-3); color: var(--fg); }
  .tp-item.active {
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    color: var(--fg); border-left-color: var(--accent);
    font-weight: 600;
  }
  .tp-item .tp-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
  }
  .tp-item .tp-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .st-item {
    padding: 4px 10px 4px 28px; margin: 0;
    border-radius: 5px;
    font-size: 11.5px; color: var(--fg-3);
    cursor: pointer; text-decoration: none;
    display: block;
    transition: all var(--transition);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .st-item:hover { background: var(--bg-3); color: var(--fg-2); padding-left: 32px; }
  .st-item.active { color: var(--accent); font-weight: 600; }

  /* ==================== MAIN CONTENT ==================== */
  main.content {
    padding: 32px 48px 120px;
    max-width: 960px;
    width: 100%;
    margin: 0 auto;
  }

  .hero {
    background: linear-gradient(135deg,
      color-mix(in srgb, var(--accent) 15%, transparent),
      color-mix(in srgb, var(--accent-2) 15%, transparent));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 32px;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--accent) 25%, transparent), transparent 60%);
    pointer-events: none;
  }
  .hero h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.02em; }
  .hero p { margin: 0; color: var(--fg-2); font-size: 14px; }

  .breadcrumb {
    display: flex; align-items: center; flex-wrap: wrap;
    gap: 6px; font-size: 12.5px; color: var(--fg-3);
    margin-bottom: 14px;
    font-family: var(--font-mono);
  }
  .breadcrumb span.sep { opacity: 0.5; }
  .breadcrumb a { color: var(--fg-3); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .current { color: var(--accent); }

  h2.chapter {
    font-size: 27px; letter-spacing: -0.02em;
    margin: 48px 0 10px; scroll-margin-top: 90px;
    display: flex; align-items: center; gap: 12px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--border);
    position: relative;
  }
  h2.chapter:first-of-type { margin-top: 0; }
  h2.chapter .chapter-badge {
    font-family: var(--font-mono); font-size: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white; padding: 4px 10px; border-radius: 6px;
    font-weight: 700; letter-spacing: 0.02em;
    box-shadow: 0 4px 12px -4px var(--accent);
  }
  h2.chapter .chapter-title-text { flex: 1; min-width: 0; }
  h2.chapter .anchor-link {
    opacity: 0; font-size: 14px; color: var(--fg-3);
    text-decoration: none; transition: opacity var(--transition);
    font-weight: 400;
  }
  h2.chapter:hover .anchor-link { opacity: 1; }
  h2.chapter .anchor-link:hover { color: var(--accent); }

  h3.topic {
    font-size: 19px; letter-spacing: -0.01em;
    margin: 28px 0 8px; scroll-margin-top: 90px;
    color: var(--fg);
    display: flex; align-items: center; gap: 10px;
  }
  h3.topic::before {
    content: ''; width: 4px; height: 18px;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    border-radius: 2px; flex-shrink: 0;
  }
  h3.topic .anchor-link {
    opacity: 0; font-size: 12px; color: var(--fg-3);
    text-decoration: none; font-weight: 400;
  }
  h3.topic:hover .anchor-link { opacity: 1; }

  h4.subtopic {
    font-size: 15.5px; font-weight: 700;
    margin: 22px 0 6px; scroll-margin-top: 90px;
    color: var(--fg-2);
    padding-left: 12px;
    border-left: 3px solid var(--border-2);
    display: flex; align-items: center; gap: 8px;
    cursor: pointer;
    transition: all var(--transition);
  }
  h4.subtopic:hover { border-left-color: var(--accent); color: var(--fg); }
  h4.subtopic .sub-marker {
    font-family: var(--font-mono); font-size: 10.5px;
    background: var(--bg-3); color: var(--fg-3);
    padding: 2px 6px; border-radius: 4px; font-weight: 600;
    flex-shrink: 0;
  }
  h4.subtopic .anchor-link {
    opacity: 0; font-size: 11px; color: var(--fg-3);
    text-decoration: none; font-weight: 400; margin-left: auto;
  }
  h4.subtopic:hover .anchor-link { opacity: 1; }

  .subtopic-body {
    padding: 4px 0 4px 12px;
  }
  .subtopic.collapsed + .subtopic-body { display: none; }

  .content-item {
    margin: 5px 0;
    color: var(--fg-2);
    font-size: 14.5px;
    line-height: 1.75;
  }
  .content-item.text { color: var(--fg); }
  .content-item.question {
    background: color-mix(in srgb, var(--amber) 10%, transparent);
    border-left: 3px solid var(--amber);
    padding: 10px 14px;
    border-radius: 0 8px 8px 0;
    margin: 10px 0;
    color: var(--fg);
    font-weight: 500;
  }
  .content-item.question::before {
    content: '❓'; margin-right: 8px; opacity: 0.7;
  }
  .content-item.bullet {
    padding-left: 22px; position: relative;
  }
  .content-item.bullet::before {
    content: '•';
    position: absolute; left: 6px; top: 0;
    color: var(--accent); font-weight: 700;
  }

  /* Keyword colours preserved from original PDF */
  .keyword-red {
    color: var(--red); font-weight: 600;
    background: color-mix(in srgb, var(--red) 10%, transparent);
    padding: 1px 4px; border-radius: 4px;
  }
  .keyword-blue {
    color: var(--blue); font-weight: 600;
    background: color-mix(in srgb, var(--blue) 10%, transparent);
    padding: 1px 4px; border-radius: 4px;
  }
  .trick-green {
    color: var(--green); font-weight: 600;
    background: color-mix(in srgb, var(--green) 10%, transparent);
    padding: 1px 4px; border-radius: 4px;
  }

  /* Tables */
  .table-wrap {
    overflow-x: auto;
    margin: 14px 0;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--panel);
    box-shadow: 0 4px 20px -10px rgba(0,0,0,0.3);
  }
  .table-wrap table {
    border-collapse: collapse; width: 100%; font-size: 13.5px;
  }
  .table-wrap td, .table-wrap th {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    vertical-align: top;
    color: var(--fg-2);
  }
  .table-wrap td:last-child, .table-wrap th:last-child { border-right: none; }
  .table-wrap tr:last-child td { border-bottom: none; }
  .table-wrap tr:hover td { background: var(--bg-3); }
  .table-wrap tr:first-child td {
    background: var(--bg-3); font-weight: 600; color: var(--fg);
  }

  /* ==================== SEARCH RESULTS ==================== */
  .search-overlay {
    position: fixed; inset: 0;
    background: color-mix(in srgb, var(--bg) 70%, transparent);
    backdrop-filter: blur(8px);
    z-index: 2000;
    display: none;
    padding: 100px 24px 40px;
    overflow-y: auto;
  }
  .search-overlay.open { display: block; }
  .search-results {
    max-width: 720px; margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--border-2);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .search-results-head {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--fg-3);
    text-transform: uppercase; letter-spacing: 0.06em;
    display: flex; justify-content: space-between;
  }
  .search-result {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background var(--transition);
  }
  .search-result:last-child { border-bottom: none; }
  .search-result:hover { background: var(--bg-3); }
  .search-result .sr-path {
    font-size: 11px; color: var(--fg-3);
    font-family: var(--font-mono); margin-bottom: 4px;
  }
  .search-result .sr-title {
    font-size: 14px; font-weight: 600; margin-bottom: 4px;
    color: var(--fg);
  }
  .search-result .sr-snippet {
    font-size: 12.5px; color: var(--fg-2);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .search-result mark { background: color-mix(in srgb, var(--amber) 40%, transparent); color: var(--fg); padding: 0 3px; border-radius: 3px; }

  .no-results { padding: 40px; text-align: center; color: var(--fg-3); }

  /* ==================== FAB / TOAST ==================== */
  .fab {
    position: fixed; right: 24px; bottom: 24px;
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white; border: none; border-radius: 50%;
    cursor: pointer; z-index: 900;
    display: grid; place-items: center;
    box-shadow: 0 10px 30px -10px var(--accent);
    transition: all var(--transition);
    opacity: 0; pointer-events: none;
  }
  .fab.show { opacity: 1; pointer-events: auto; }
  .fab:hover { transform: translateY(-3px) scale(1.05); }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--fg); color: var(--bg);
    padding: 10px 20px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
    z-index: 3000; opacity: 0;
    transition: all 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: var(--shadow);
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ==================== MOBILE ==================== */
  @media (max-width: 1024px) {
    :root { --sidebar-w: 300px; }
    main.content { padding: 24px 32px 100px; }
  }
  @media (max-width: 768px) {
    .menu-toggle { display: grid; }
    .kbd { display: none; }
    .search-wrap { max-width: none; }
    .brand-title small { display: none; }
    .layout { grid-template-columns: 1fr; }
    aside.sidebar {
      position: fixed; top: var(--header-h); left: 0; bottom: 0;
      width: min(85vw, 340px); z-index: 900;
      transform: translateX(-100%);
      transition: transform var(--transition);
      box-shadow: var(--shadow);
    }
    aside.sidebar.open { transform: translateX(0); }
    main.content { padding: 20px 18px 100px; }
    h2.chapter { font-size: 22px; }
    h3.topic { font-size: 17px; }
    .hero { padding: 20px; }
    .hero h1 { font-size: 20px; }
  }

  /* ==================== PRINT ==================== */
  @media print {
    header.topbar, aside.sidebar, .fab, #progress-bar, .search-overlay { display: none !important; }
    .layout { grid-template-columns: 1fr; padding-top: 0; }
    main.content { padding: 0; max-width: none; }
    h2.chapter { page-break-before: always; }
    h2.chapter:first-of-type { page-break-before: auto; }
    a { color: inherit; text-decoration: none; }
    .content-item.question { background: #f5f5f5; }
  }

  ::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }
</style>
</head>
<body>

<div id="progress-bar"></div>

<!-- ==================== HEADER ==================== -->
<header class="topbar">
  <button class="icon-btn menu-toggle" id="menuBtn" aria-label="Toggle menu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="brand">
    <div class="brand-logo">A</div>
    <div class="brand-title">
      <span>Audit Notes</span>
      <small>Study Companion</small>
    </div>
  </div>

  <div class="search-wrap">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="searchInput" type="text" placeholder="Search across all chapters, topics, content…" autocomplete="off" />
    <span class="kbd">Ctrl K</span>
  </div>

  <div class="topbar-actions">
    <button class="icon-btn" id="expandAllBtn" title="Expand all">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
    </button>
    <button class="icon-btn" id="collapseAllBtn" title="Collapse all">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 9l-5-5-5 5M17 15l-5 5-5-5"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="Toggle theme">
      <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<!-- ==================== SEARCH OVERLAY ==================== -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-results" id="searchResults">
    <div class="search-results-head">
      <span id="searchCount">Type to search…</span>
      <span style="font-family: var(--font-mono);">ESC to close</span>
    </div>
    <div id="searchBody"></div>
  </div>
</div>

<!-- ==================== LAYOUT ==================== -->
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-stats">
      <div class="stat"><span class="stat-num" id="statCh">—</span><span class="stat-label">Chapters</span></div>
      <div class="stat"><span class="stat-num" id="statTp">—</span><span class="stat-label">Topics</span></div>
      <div class="stat"><span class="stat-num" id="statSt">—</span><span class="stat-label">Subtopics</span></div>
    </div>
    <div class="sidebar-heading">Contents</div>
    <nav id="toc"></nav>
  </aside>

  <main class="content" id="main">
    <div class="hero">
      <h1 id="heroTitle">Loading notes…</h1>
      <p id="heroMeta"></p>
    </div>
    <div id="contentRoot"></div>
  </main>
</div>

<!-- ==================== FLOATING BUTTONS ==================== -->
<button class="fab" id="topFab" aria-label="Back to top" title="Back to top">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<div class="toast" id="toast"></div>

<!-- ==================== SCRIPT ==================== -->
<script>
(function() {
  "use strict";

  // ---------- STATE ----------
  const state = {
    data: null,
    allNodes: [],   // flat list for search
    activeId: null,
  };

  // ---------- UTILS ----------
  const $  = (sel, ctx = document) => ctx.querySelector(sel);
  const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  function stripHtml(s) {
    const d = document.createElement('div'); d.innerHTML = s || '';
    return d.textContent || '';
  }

  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  function copyToClipboard(text, msg = "Link copied") {
    navigator.clipboard?.writeText(text).then(() => toast(msg))
      .catch(() => toast("Copy failed"));
  }

  // ---------- LOAD JSON ----------
  async function loadData() {
    // 1. Try embedded script tag (works from file://)
    const embedded = document.getElementById('__DATA__');
    if (embedded && embedded.textContent.trim()) {
      try { return JSON.parse(embedded.textContent); } catch(e) { console.warn(e); }
    }
    // 2. Try fetch (needs local server OR file:// in some browsers allows if same folder)
    try {
      const res = await fetch('audit_flashcards_chapterwise.json');
      if (res.ok) return await res.json();
    } catch(e) { /* fall through */ }

    // 3. Ask user to drop file
    return await promptFileDrop();
  }

  function promptFileDrop() {
    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.innerHTML = `
        <div style="position:fixed;inset:0;background:var(--bg);z-index:9999;display:grid;place-items:center;padding:40px;">
          <div style="max-width:520px;text-align:center;border:2px dashed var(--border-2);padding:60px 40px;border-radius:16px;background:var(--panel);">
            <div style="font-size:52px;margin-bottom:14px;">📖</div>
            <h2 style="margin:0 0 8px;">Drop your JSON file here</h2>
            <p style="color:var(--fg-2);margin-bottom:20px;font-size:14px;">
              Or click to browse. Expecting <code>audit_flashcards_chapterwise.json</code>.
            </p>
            <input type="file" accept=".json,application/json" id="filePick" style="display:none;" />
            <button class="icon-btn" style="width:auto;padding:10px 22px;border-radius:10px;font-weight:600;" id="pickBtn">Choose file</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);

      const fileInput = overlay.querySelector('#filePick');
      const pickBtn = overlay.querySelector('#pickBtn');

      const handleFile = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const json = JSON.parse(e.target.result);
            overlay.remove();
            resolve(json);
          } catch (err) {
            alert("Invalid JSON: " + err.message);
          }
        };
        reader.readAsText(file);
      };

      pickBtn.onclick = () => fileInput.click();
      fileInput.onchange = (e) => handleFile(e.target.files[0]);

      overlay.addEventListener('dragover', (e) => { e.preventDefault(); });
      overlay.addEventListener('drop', (e) => {
        e.preventDefault();
        handleFile(e.dataTransfer.files[0]);
      });
    });
  }

  // ---------- RENDER SIDEBAR TOC ----------
  function renderToc() {
    const nav = $('#toc');
    nav.innerHTML = '';
    const frag = document.createDocumentFragment();

    state.data.chapters.forEach((ch) => {
      const group = document.createElement('div');
      group.className = 'ch-group';
      group.dataset.chapterId = ch.id;

      // Chapter head
      const head = document.createElement('div');
      head.className = 'ch-head';
      head.dataset.target = ch.id;
      head.innerHTML = `
        <svg class="caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
        <span class="ch-num">${esc(ch.chapter_number)}</span>
        <span class="ch-title">${esc(ch.chapter_title_plain || ch.chapter_title)}</span>`;
      head.addEventListener('click', (e) => {
        if (e.target.closest('.ch-title') || e.target === head) {
          group.classList.toggle('open');
        }
        scrollToId(ch.id);
      });
      group.appendChild(head);

      // Chapter body
      const body = document.createElement('div');
      body.className = 'ch-body';

      (ch.topics || []).forEach((tp) => {
        const tpEl = document.createElement('a');
        tpEl.className = 'tp-item';
        tpEl.dataset.target = tp.id;
        tpEl.href = '#' + tp.id;
        tpEl.innerHTML = `<span class="tp-dot"></span><span class="tp-name">${esc(tp.topic_title_plain || tp.topic_title)}</span>`;
        tpEl.addEventListener('click', (e) => { e.preventDefault(); scrollToId(tp.id); });
        body.appendChild(tpEl);

        (tp.subtopics || []).forEach((st) => {
          const stEl = document.createElement('a');
          stEl.className = 'st-item';
          stEl.dataset.target = st.id;
          stEl.href = '#' + st.id;
          stEl.title = st.subtopic_heading_plain || st.subtopic_heading;
          stEl.textContent = st.subtopic_heading_plain || st.subtopic_heading;
          stEl.addEventListener('click', (e) => { e.preventDefault(); scrollToId(st.id); });
          body.appendChild(stEl);
        });
      });

      group.appendChild(body);
      frag.appendChild(group);
    });

    nav.appendChild(frag);
  }

  // ---------- RENDER MAIN CONTENT ----------
  function renderContent() {
    const root = $('#contentRoot');
    root.innerHTML = '';
    const frag = document.createDocumentFragment();

    state.data.chapters.forEach((ch) => {
      // Chapter heading
      const h2 = document.createElement('h2');
      h2.className = 'chapter';
      h2.id = ch.id;
      h2.innerHTML = `
        <span class="chapter-badge">Ch. ${esc(ch.chapter_number)}</span>
        <span class="chapter-title-text">${esc(ch.chapter_title_plain || ch.chapter_title)}</span>
        <a class="anchor-link" href="#${esc(ch.id)}" title="Copy link">🔗</a>`;
      h2.querySelector('.anchor-link').addEventListener('click', (e) => {
        e.preventDefault();
        copyToClipboard(location.origin + location.pathname + '#' + ch.id);
      });
      frag.appendChild(h2);

      (ch.topics || []).forEach((tp) => {
        // Topic heading
        const h3 = document.createElement('h3');
        h3.className = 'topic';
        h3.id = tp.id;
        h3.innerHTML = `
          <span>${esc(tp.topic_title_plain || tp.topic_title)}</span>
          <a class="anchor-link" href="#${esc(tp.id)}" title="Copy link">🔗</a>`;
        h3.querySelector('.anchor-link').addEventListener('click', (e) => {
          e.preventDefault();
          copyToClipboard(location.origin + location.pathname + '#' + tp.id);
        });
        frag.appendChild(h3);

        (tp.subtopics || []).forEach((st) => {
          // Subtopic heading
          const h4 = document.createElement('h4');
          h4.className = 'subtopic';
          h4.id = st.id;
          h4.innerHTML = `
            <span class="sub-marker">${esc(String(st.subtopic_number).padStart(2, '0'))}</span>
            <span>${esc(st.subtopic_heading_plain || st.subtopic_heading)}</span>
            <a class="anchor-link" href="#${esc(st.id)}" title="Copy link">🔗</a>`;
          h4.querySelector('.anchor-link').addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            copyToClipboard(location.origin + location.pathname + '#' + st.id);
          });
          // Click heading toggles collapse
          h4.addEventListener('click', (e) => {
            if (e.target.classList.contains('anchor-link')) return;
            h4.classList.toggle('collapsed');
          });
          frag.appendChild(h4);

          // Subtopic body
          const body = document.createElement('div');
          body.className = 'subtopic-body';

          const items = st.content || [];
          let bulletBuf = [];

          const flushBullets = () => {
            if (!bulletBuf.length) return;
            const ul = document.createElement('div');
            ul.className = 'bullet-list';
            bulletBuf.forEach((html) => {
              const d = document.createElement('div');
              d.className = 'content-item bullet';
              d.innerHTML = html;
              ul.appendChild(d);
            });
            body.appendChild(ul);
            bulletBuf = [];
          };

          items.forEach((item) => {
            if (item.type === 'table') {
              flushBullets();
              const wrap = document.createElement('div');
              wrap.className = 'table-wrap';
              const tbl = document.createElement('table');
              (item.data || []).forEach((row) => {
                const tr = document.createElement('tr');
                row.forEach((cell) => {
                  const td = document.createElement('td');
                  td.innerHTML = cell || '';
                  tr.appendChild(td);
                });
                tbl.appendChild(tr);
              });
              wrap.appendChild(tbl);
              body.appendChild(wrap);
            } else if (item.type === 'bullet') {
              bulletBuf.push(item.html || '');
            } else {
              flushBullets();
              const d = document.createElement('div');
              d.className = 'content-item ' + (item.type === 'question' ? 'question' : 'text');
              d.innerHTML = item.html || '';
              body.appendChild(d);
            }
          });
          flushBullets();

          // If subtopic has NO content items, add a small placeholder
          if (!body.children.length) {
            const p = document.createElement('div');
            p.className = 'content-item text';
            p.style.color = 'var(--fg-3)';
            p.style.fontStyle = 'italic';
            p.textContent = '— no content extracted for this subtopic —';
            body.appendChild(p);
          }

          frag.appendChild(body);
        });
      });
    });

    root.appendChild(frag);
  }

  // ---------- FLATTEN FOR SEARCH ----------
  function buildIndex() {
    state.allNodes = [];
    state.data.chapters.forEach((ch) => {
      const chPath = `Ch.${ch.chapter_number} · ${ch.chapter_title_plain || ch.chapter_title}`;
      state.allNodes.push({
        id: ch.id, type: 'chapter', path: chPath,
        title: ch.chapter_title_plain || ch.chapter_title, text: ''
      });
      (ch.topics || []).forEach((tp) => {
        const tpPath = `${chPath} › ${tp.topic_title_plain || tp.topic_title}`;
        state.allNodes.push({
          id: tp.id, type: 'topic', path: tpPath,
          title: tp.topic_title_plain || tp.topic_title, text: ''
        });
        (tp.subtopics || []).forEach((st) => {
          const stPath = `${tpPath} › ${st.subtopic_heading_plain || st.subtopic_heading}`;
          const bodyText = (st.content || [])
            .map((c) => c.plain || stripHtml(c.html || ''))
            .filter(Boolean)
            .join('  ');
          state.allNodes.push({
            id: st.id, type: 'subtopic', path: stPath,
            title: st.subtopic_heading_plain || st.subtopic_heading,
            text: bodyText
          });
        });
      });
    });
  }

  // ---------- SEARCH ----------
  function doSearch(query) {
    const q = query.trim().toLowerCase();
    const body = $('#searchBody');
    const countEl = $('#searchCount');

    if (q.length < 2) {
      countEl.textContent = 'Type at least 2 characters…';
      body.innerHTML = '';
      return;
    }

    const results = [];
    for (const node of state.allNodes) {
      const hay = (node.title + ' ' + node.text + ' ' + node.path).toLowerCase();
      const idx = hay.indexOf(q);
      if (idx === -1) continue;
      // Build a snippet around match
      let snippet = '';
      const combined = node.title + ' — ' + node.text;
      const lower = combined.toLowerCase();
      const m = lower.indexOf(q);
      if (m !== -1) {
        const start = Math.max(0, m - 60);
        const end = Math.min(combined.length, m + q.length + 120);
        snippet = (start > 0 ? '…' : '') + combined.slice(start, end) + (end < combined.length ? '…' : '');
      } else {
        snippet = combined.slice(0, 180);
      }
      results.push({ ...node, snippet, score: idx });
      if (results.length >= 60) break;
    }

    // Prioritize title matches
    results.sort((a, b) => {
      const at = a.title.toLowerCase().includes(q) ? 0 : 1;
      const bt = b.title.toLowerCase().includes(q) ? 0 : 1;
      return at - bt;
    });

    countEl.textContent = `${results.length} result${results.length === 1 ? '' : 's'} for "${query}"`;

    if (!results.length) {
      body.innerHTML = `<div class="no-results">No matches found</div>`;
      return;
    }

    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    body.innerHTML = results.map((r) => `
      <div class="search-result" data-id="${esc(r.id)}">
        <div class="sr-path">${esc(r.path)}</div>
        <div class="sr-title">${esc(r.title).replace(re, '<mark>$1</mark>')}</div>
        <div class="sr-snippet">${esc(r.snippet).replace(re, '<mark>$1</mark>')}</div>
      </div>
    `).join('');

    $$('.search-result', body).forEach((el) => {
      el.addEventListener('click', () => {
        closeSearch();
        scrollToId(el.dataset.id);
      });
    });
  }

  function openSearch() {
    $('#searchOverlay').classList.add('open');
    setTimeout(() => $('#searchInput').focus(), 30);
  }
  function closeSearch() {
    $('#searchOverlay').classList.remove('open');
    $('#searchInput').blur();
  }

  // ---------- SCROLL + ACTIVE HIGHLIGHT ----------
  function scrollToId(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const y = el.getBoundingClientRect().top + window.scrollY - 90;
    window.scrollTo({ top: y, behavior: 'smooth' });
    state.activeId = id;

    // Auto-open parent chapter in sidebar
    const stItem = $(`.st-item[data-target="${CSS.escape(id)}"]`);
    const tpItem = $(`.tp-item[data-target="${CSS.escape(id)}"]`);
    const chHead = $(`.ch-head[data-target="${CSS.escape(id)}"]`);
    const target = stItem || tpItem || chHead;
    if (target) {
      const grp = target.closest('.ch-group');
      if (grp) grp.classList.add('open');
      highlightSidebar(id);
    }
  }

  function highlightSidebar(id) {
    $$('.ch-head.active, .tp-item.active, .st-item.active').forEach((el) => el.classList.remove('active'));
    const el = $(`[data-target="${CSS.escape(id)}"].ch-head, [data-target="${CSS.escape(id)}"].tp-item, [data-target="${CSS.escape(id)}"].st-item`);
    if (el) {
      el.classList.add('active');
      el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  function setupScrollTracking() {
    const progress = $('#progress-bar');
    const fab = $('#topFab');

    window.addEventListener('scroll', () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      const pct = h > 0 ? (window.scrollY / h) * 100 : 0;
      progress.style.width = pct + '%';
      if (window.scrollY > 400) fab.classList.add('show');
      else fab.classList.remove('show');
    }, { passive: true });

    // IntersectionObserver for active section highlighting
    const headings = $$('.chapter, .topic, .subtopic');
    const obs = new IntersectionObserver((entries) => {
      const visible = entries
        .filter(e => e.isIntersecting)
        .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (visible.length) {
        const id = visible[0].target.id;
        if (state.activeId !== id) {
          state.activeId = id;
          highlightSidebar(id);
        }
      }
    }, { rootMargin: '-90px 0px -70% 0px', threshold: 0 });

    headings.forEach(h => obs.observe(h));
  }

  // ---------- THEME ----------
  function initTheme() {
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = saved || (prefersDark ? 'dark' : 'light');
    document.documentElement.dataset.theme = theme;
    updateThemeIcon();
  }

  function updateThemeIcon() {
    const dark = document.documentElement.dataset.theme === 'dark';
    $('#themeIcon').innerHTML = dark
      ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
      : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  }

  function toggleTheme() {
    const cur = document.documentElement.dataset.theme;
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('theme', next);
    updateThemeIcon();
  }

  // ---------- EXPAND / COLLAPSE ----------
  function expandAll()  { $$('.ch-group').forEach(g => g.classList.add('open')); }
  function collapseAll(){ $$('.ch-group').forEach(g => g.classList.remove('open')); }

  // ---------- INIT ----------
  async function init() {
    initTheme();

    try {
      state.data = await loadData();
    } catch (e) {
      $('#contentRoot').innerHTML = `<div class="no-results">Failed to load JSON: ${esc(e.message)}</div>`;
      return;
    }

    // Stats
    const chapters = state.data.chapters || [];
    const topics = chapters.reduce((a, c) => a + (c.topics?.length || 0), 0);
    const subs   = chapters.reduce((a, c) => a + (c.topics||[]).reduce((x, t) => x + (t.subtopics?.length || 0), 0), 0);
    $('#statCh').textContent = chapters.length;
    $('#statTp').textContent = topics;
    $('#statSt').textContent = subs;

    $('#heroTitle').textContent = state.data.metadata?.title || 'Audit Notes';
    $('#heroMeta').textContent = `${chapters.length} chapters · ${topics} topics · ${subs} subtopics`;

    renderToc();
    renderContent();
    buildIndex();
    setupScrollTracking();

    // Open first chapter by default
    const firstGroup = $('.ch-group');
    if (firstGroup) firstGroup.classList.add('open');

    // Deep-link support
    if (location.hash) {
      setTimeout(() => scrollToId(location.hash.slice(1)), 400);
    }
  }

  // ---------- EVENTS ----------
  document.addEventListener('DOMContentLoaded', () => {
    init();

    // Theme
    $('#themeBtn').addEventListener('click', toggleTheme);

    // Expand / collapse
    $('#expandAllBtn').addEventListener('click', expandAll);
    $('#collapseAllBtn').addEventListener('click', collapseAll);

    // Mobile menu
    $('#menuBtn').addEventListener('click', () => {
      $('#sidebar').classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
      if (window.innerWidth <= 768 &&
          !e.target.closest('#sidebar') &&
          !e.target.closest('#menuBtn')) {
        $('#sidebar').classList.remove('open');
      }
    });

    // Search
    const searchInput = $('#searchInput');
    searchInput.addEventListener('input', (e) => doSearch(e.target.value));
    searchInput.addEventListener('focus', () => openSearch());
    $('#searchOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'searchOverlay') closeSearch();
    });

    // Global keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      // Ctrl/Cmd + K → search
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault(); openSearch();
      }
      // "/" (when not in an input) → search
      if (e.key === '/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) {
        e.preventDefault(); openSearch();
      }
      // Escape
      if (e.key === 'Escape') {
        closeSearch();
        $('#sidebar').classList.remove('open');
      }
      // T → toggle theme
      if (e.key.toLowerCase() === 't' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName) && !e.ctrlKey && !e.metaKey) {
        toggleTheme();
      }
    });

    // Top FAB
    $('#topFab').addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
})();
</script>
</body>
</html>
