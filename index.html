<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>All SAs Magic Book — Q&A Flashcards</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap');

:root {
    --bg: #0b1120;
    --bg2: #111c33;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --text: #0f172a;
    --text-2: #475569;
    --border: #e2e8f0;
    --primary: #2563eb;
    --amber: #f59e0b;
    --amber-2: #fbbf24;
    --amber-bg: #fef3c7;
    --amber-text: #78350f;
    --violet: #7c3aed;
    --violet-bg: #f3e8ff;
    --green: #059669;
    --green-bg: #d1fae5;
    --red: #dc2626;
    --red-bg: #fee2e2;
    --star: #f59e0b;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
    height: 100%; overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
}
body {
    background: radial-gradient(circle at 50% 0%, #1e293b, #0b1120 65%);
}

/* ── App shell ─────────────────────────────────────── */
.app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 520px;
    margin: 0 auto;
    background: var(--bg);
    position: relative;
    overflow: hidden;
}

/* ── Screens ───────────────────────────────────────── */
.screen {
    display: none;
    flex-direction: column;
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}
.screen.active { display: flex; }

/* ══════════════════════════════════════════════════════
   HOME SCREEN
   ══════════════════════════════════════════════════════ */
.home-hero {
    background: linear-gradient(135deg, #7c2d12 0%, #b45309 40%, #f59e0b 100%);
    padding: 32px 22px 26px;
    border-radius: 0 0 26px 26px;
    color: #fff;
    box-shadow: 0 12px 40px rgba(245, 158, 11, 0.25);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
}
.home-hero::before {
    content: '';
    position: absolute;
    top: -80px; right: -60px;
    width: 220px; height: 220px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 50%;
}
.home-hero::after {
    content: '';
    position: absolute;
    bottom: -50px; left: -40px;
    width: 150px; height: 150px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 50%;
}
.home-hero h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.55rem;
    font-weight: 800;
    line-height: 1.15;
    margin-bottom: 6px;
    position: relative;
    z-index: 1;
}
.home-hero p {
    font-size: 0.82rem;
    opacity: 0.92;
    position: relative;
    z-index: 1;
    line-height: 1.5;
}
.home-hero .stat-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    position: relative;
    z-index: 1;
}
.home-hero .stat-chip {
    flex: 1;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 14px;
    padding: 10px;
    text-align: center;
}
.home-hero .stat-chip strong {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-size: 1.15rem;
    font-weight: 800;
    line-height: 1.1;
}
.home-hero .stat-chip span {
    display: block;
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    opacity: 0.85;
    margin-top: 3px;
    font-weight: 700;
}

/* Overall progress bar */
.overall-bar {
    margin: 14px 22px 0;
    height: 8px;
    background: rgba(255, 255, 255, 0.18);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    z-index: 1;
}
.overall-bar > div {
    height: 100%;
    background: #fff;
    border-radius: 6px;
    width: 0%;
    transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.overall-row {
    display: flex;
    justify-content: space-between;
    margin: 8px 22px 0;
    font-size: 0.7rem;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.9);
    position: relative;
    z-index: 1;
    letter-spacing: 0.3px;
}

/* Search bar */
.search-wrap {
    padding: 16px 18px 12px;
    flex-shrink: 0;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 5;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}
.search-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    padding: 11px 14px;
    transition: 0.2s;
}
.search-bar:focus-within {
    border-color: var(--amber);
    background: rgba(251, 191, 36, 0.08);
}
.search-bar i {
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.9rem;
}
.search-bar input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: #fff;
    font-size: 0.85rem;
    font-family: inherit;
}
.search-bar input::placeholder { color: rgba(255, 255, 255, 0.4); }

/* Filter pills */
.filter-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 10px 18px 2px;
    scrollbar-width: none;
    flex-shrink: 0;
}
.filter-row::-webkit-scrollbar { display: none; }
.filter-pill {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.04);
    color: rgba(255, 255, 255, 0.7);
    font-size: 0.7rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: 0.2s;
    font-family: inherit;
}
.filter-pill:active { transform: scale(0.95); }
.filter-pill.active {
    background: var(--amber);
    color: #fff;
    border-color: var(--amber);
    box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
}

/* Chapter list */
.chapters-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px 40px;
    -webkit-overflow-scrolling: touch;
}
.chapter-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 14px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
}
.chapter-card:active {
    transform: scale(0.985);
    background: rgba(255, 255, 255, 0.08);
}
.chapter-card.done {
    border-color: rgba(16, 185, 129, 0.4);
    background: rgba(16, 185, 129, 0.08);
}
.ch-num {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
}
.chapter-card.done .ch-num {
    background: linear-gradient(135deg, #10b981, #059669);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
}
.ch-info {
    flex: 1;
    min-width: 0;
}
.ch-info h4 {
    font-size: 0.83rem;
    font-weight: 700;
    color: #fff;
    line-height: 1.3;
    margin-bottom: 6px;
    font-family: 'Poppins', sans-serif;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.ch-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.66rem;
    color: rgba(255, 255, 255, 0.55);
    font-weight: 600;
    margin-bottom: 6px;
}
.ch-meta .dot {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.4;
}
.ch-mini-bar {
    height: 4px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
}
.ch-mini-bar > div {
    height: 100%;
    background: linear-gradient(90deg, #fbbf24, #f59e0b);
    border-radius: 4px;
    width: 0%;
    transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
.chapter-card.done .ch-mini-bar > div {
    background: linear-gradient(90deg, #34d399, #10b981);
}
.ch-arrow {
    color: rgba(255, 255, 255, 0.3);
    font-size: 0.8rem;
    flex-shrink: 0;
}

/* Footer credit */
.footer-credit {
    padding: 20px 18px 26px;
    text-align: center;
    font-size: 0.68rem;
    color: rgba(255, 255, 255, 0.4);
    font-weight: 500;
    letter-spacing: 0.3px;
}

/* ══════════════════════════════════════════════════════
   DECK SCREEN (flashcards)
   ══════════════════════════════════════════════════════ */
.deck-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    flex-shrink: 0;
    z-index: 10;
}
.deck-header .btn-back {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
    flex-shrink: 0;
}
.deck-header .btn-back:active { transform: scale(0.9); }
.deck-title {
    flex: 1;
    min-width: 0;
    text-align: center;
}
.deck-title h3 {
    font-family: 'Poppins', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.deck-title p {
    font-size: 0.66rem;
    color: rgba(255, 255, 255, 0.55);
    margin-top: 2px;
    font-weight: 600;
}
.deck-header .btn-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #fbbf24;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
    flex-shrink: 0;
}
.deck-header .btn-icon:active { transform: scale(0.9); }

.deck-progress {
    height: 3px;
    background: rgba(255, 255, 255, 0.08);
    margin: 0 16px;
    border-radius: 3px;
    overflow: hidden;
    flex-shrink: 0;
}
.deck-progress > div {
    height: 100%;
    background: linear-gradient(90deg, #fbbf24, #f59e0b);
    border-radius: 3px;
    width: 0%;
    transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ── Flashcard stage ──────────────────────────────── */
.stage {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    min-height: 0;
    touch-action: none;
    overflow: hidden;
}

.card {
    position: absolute;
    width: min(90%, 440px);
    height: min(66vh, 520px);
    perspective: 1400px;
    will-change: transform, opacity;
    transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    touch-action: none;
}
.card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    border-radius: 22px;
}
.card.flipped .card-inner { transform: rotateY(180deg); }

.card-face {
    position: absolute;
    inset: 0;
    border-radius: 22px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    padding: 24px 22px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    overflow: hidden;
    border: 2px solid transparent;
}

/* Front face */
.card-front {
    background: linear-gradient(160deg, #fffbeb 0%, #fef3c7 100%);
    color: #451a03;
    border-color: rgba(251, 191, 36, 0.5);
}
.card-front.t-case { background: linear-gradient(160deg, #eff6ff 0%, #dbeafe 100%); color: #1e3a8a; border-color: rgba(59, 130, 246, 0.4); }
.card-front.t-icai { background: linear-gradient(160deg, #fef2f2 0%, #fee2e2 100%); color: #7f1d1d; border-color: rgba(239, 68, 68, 0.5); }
.card-front.t-chart { background: linear-gradient(160deg, #f5f3ff 0%, #ede9fe 100%); color: #3b0764; border-color: rgba(124, 58, 237, 0.4); }
.card-front.t-table { background: linear-gradient(160deg, #ecfdf5 0%, #d1fae5 100%); color: #064e3b; border-color: rgba(16, 185, 129, 0.4); }

/* Back face */
.card-back {
    background: linear-gradient(155deg, #1e1b4b 0%, #312e81 55%, #4c1d95 100%);
    color: #f8fafc;
    transform: rotateY(180deg);
    border-color: rgba(255, 255, 255, 0.08);
    padding: 20px 20px 14px;
}

/* Card top row */
.card-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    flex-shrink: 0;
}
.card-badge {
    font-size: 0.58rem;
    font-weight: 800;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 20px;
    background: rgba(180, 83, 9, 0.14);
    color: #78350f;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: 'Poppins', sans-serif;
}
.card-front.t-case .card-badge { background: rgba(37, 99, 235, 0.14); color: #1e40af; }
.card-front.t-icai .card-badge { background: rgba(220, 38, 38, 0.14); color: #991b1b; }
.card-front.t-chart .card-badge { background: rgba(124, 58, 237, 0.14); color: #5b21b6; }
.card-front.t-table .card-badge { background: rgba(5, 150, 105, 0.14); color: #065f46; }

.card-num-badge {
    font-size: 0.6rem;
    font-weight: 800;
    padding: 5px 10px;
    border-radius: 20px;
    background: linear-gradient(135deg, #fbbf24, #d97706);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    box-shadow: 0 3px 8px rgba(245, 158, 11, 0.35);
    flex-shrink: 0;
}
.card-front.t-case .card-num-badge { background: linear-gradient(135deg, #60a5fa, #2563eb); box-shadow: 0 3px 8px rgba(37, 99, 235, 0.35); }
.card-front.t-icai .card-num-badge { background: linear-gradient(135deg, #f87171, #dc2626); box-shadow: 0 3px 8px rgba(220, 38, 38, 0.35); }
.card-front.t-chart .card-num-badge { background: linear-gradient(135deg, #a78bfa, #7c3aed); box-shadow: 0 3px 8px rgba(124, 58, 237, 0.35); }
.card-front.t-table .card-num-badge { background: linear-gradient(135deg, #34d399, #059669); box-shadow: 0 3px 8px rgba(16, 185, 129, 0.35); }

.card-star {
    margin-left: auto;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1.5px solid rgba(180, 83, 9, 0.3);
    background: rgba(255, 255, 255, 0.6);
    color: #b45309;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
}
.card-star:active { transform: scale(0.85); }
.card-star.active {
    background: linear-gradient(135deg, #fbbf24, #d97706);
    border-color: #d97706;
    color: #fff;
    box-shadow: 0 3px 12px rgba(245, 158, 11, 0.55);
}

/* Front content */
.card-q {
    font-family: 'Poppins', sans-serif;
    font-size: 1.02rem;
    font-weight: 700;
    line-height: 1.55;
    flex: 1;
    overflow-y: auto;
    padding-right: 4px;
    -webkit-overflow-scrolling: touch;
    word-break: break-word;
}
.card-q p { margin: 0 0 8px; }
.card-q p:last-child { margin-bottom: 0; }

.card-hint {
    text-align: center;
    font-size: 0.66rem;
    font-weight: 700;
    color: rgba(180, 83, 9, 0.7);
    margin-top: 12px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    animation: hintPulse 2s ease-in-out infinite;
}
.card-front.t-case .card-hint { color: rgba(37, 99, 235, 0.7); }
.card-front.t-icai .card-hint { color: rgba(220, 38, 38, 0.7); }
.card-front.t-chart .card-hint { color: rgba(124, 58, 237, 0.7); }
.card-front.t-table .card-hint { color: rgba(5, 150, 105, 0.7); }
@keyframes hintPulse { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } }

/* Back content */
.card-back .back-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    margin-bottom: 12px;
    flex-shrink: 0;
}
.card-back .back-head h4 {
    font-size: 0.82rem;
    font-weight: 700;
    color: #fff;
    line-height: 1.35;
    font-family: 'Poppins', sans-serif;
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.card-back .back-head .back-num {
    font-size: 0.62rem;
    font-weight: 800;
    padding: 4px 9px;
    border-radius: 14px;
    background: rgba(251, 191, 36, 0.22);
    color: #fde68a;
    flex-shrink: 0;
}
.card-answer {
    flex: 1;
    overflow-y: auto;
    padding-right: 6px;
    -webkit-overflow-scrolling: touch;
    font-size: 0.82rem;
    line-height: 1.65;
    color: #e2e8f0;
}
.card-answer p { margin: 0 0 10px; }
.card-answer ul, .card-answer ol { margin: 0 0 10px; padding-left: 20px; }
.card-answer li { margin-bottom: 5px; line-height: 1.6; }
.card-answer strong { color: #fbbf24; font-weight: 700; }
.card-answer em { color: #c4b5fd; font-style: normal; font-weight: 600; }

/* Keyword badges (from JSON a_html / q_html) */
.kw-std {
    display: inline-block;
    background: rgba(251, 191, 36, 0.28);
    color: #fde68a;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 5px;
    font-size: 0.92em;
    letter-spacing: 0.2px;
    border: 1px solid rgba(251, 191, 36, 0.35);
    font-family: 'Inter', sans-serif;
}
.card-front .kw-std {
    background: rgba(120, 53, 15, 0.15);
    color: #78350f;
    border-color: rgba(120, 53, 15, 0.25);
}
mark.kw {
    background: linear-gradient(180deg, transparent 60%, rgba(251, 191, 36, 0.55) 60%);
    color: inherit;
    padding: 0 2px;
    border-radius: 2px;
    font-weight: 700;
}
.card-front mark.kw {
    background: linear-gradient(180deg, transparent 60%, rgba(217, 119, 6, 0.35) 60%);
}

/* Tables inside cards */
.card-answer .tbl-wrap, .card-answer .cmp { margin: 6px 0 12px; }
.card-answer table.magic-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.76rem;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 8px;
    overflow: hidden;
}
.card-answer table.magic-table th {
    background: rgba(251, 191, 36, 0.15);
    padding: 8px 10px;
    text-align: left;
    font-weight: 700;
    color: #fde68a;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
.card-answer table.magic-table td {
    padding: 7px 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    color: #e2e8f0;
    vertical-align: top;
}
.card-answer table.magic-table tr:last-child td { border-bottom: none; }

.card-answer .cmp {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
}
@media (min-width: 480px) { .card-answer .cmp { grid-template-columns: 1fr 1fr; } }
.card-answer .cmp .col {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 10px 12px;
}
.card-answer .cmp .col strong {
    display: block;
    font-size: 0.76rem;
    color: #fbbf24;
    margin-bottom: 6px;
    padding-bottom: 5px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
.card-answer .cmp .col ul { padding-left: 16px; margin: 0; }
.card-answer .cmp .col li { font-size: 0.75rem; line-height: 1.5; }

.card-answer ul.bullet-grid, .card-answer ul.kv-list {
    list-style: none;
    padding: 0;
}
.card-answer ul.bullet-grid li {
    padding: 7px 10px;
    background: rgba(255, 255, 255, 0.05);
    border-left: 3px solid #fbbf24;
    border-radius: 6px;
    margin-bottom: 6px;
    font-size: 0.78rem;
    line-height: 1.5;
}
.card-answer ul.kv-list li {
    padding: 7px 10px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 6px;
    margin-bottom: 6px;
    font-size: 0.78rem;
    line-height: 1.5;
}

/* Chart images */
.card-answer .chart-wrapper {
    background: #fff;
    border-radius: 10px;
    padding: 8px;
    margin: 6px 0;
    overflow-x: auto;
}
.card-answer .magic-chart {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: 6px;
}

/* Flip hint on back */
.card-back .back-hint {
    text-align: center;
    font-size: 0.62rem;
    color: rgba(255, 255, 255, 0.35);
    margin-top: 10px;
    font-weight: 600;
    letter-spacing: 0.3px;
    flex-shrink: 0;
}

/* Swipe stamps */
.stamp {
    position: absolute;
    top: 26px;
    font-size: 0.82rem;
    font-weight: 900;
    letter-spacing: 1.5px;
    padding: 9px 15px;
    border-radius: 11px;
    border: 3px solid;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    z-index: 5;
}
.stamp-yes { right: 24px; color: #059669; border-color: #059669; transform: rotate(12deg); background: rgba(255,255,255,0.9); }
.stamp-no { left: 24px; color: #dc2626; border-color: #dc2626; transform: rotate(-12deg); background: rgba(255,255,255,0.9); }

/* First-card hint pill */
.swipe-hint {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 8;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    padding: 8px 16px;
    border-radius: 30px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 0.7rem;
    letter-spacing: 0.6px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    pointer-events: none;
    animation: hintPulse 2s ease-in-out infinite;
}
.swipe-hint .hint-l { color: #fca5a5; animation: hintL 1.6s ease-in-out infinite; }
.swipe-hint .hint-r { color: #6ee7b7; animation: hintR 1.6s ease-in-out infinite; }
@keyframes hintL { 0%, 100% { transform: translateX(0); opacity: 0.7; } 50% { transform: translateX(-4px); opacity: 1; } }
@keyframes hintR { 0%, 100% { transform: translateX(0); opacity: 0.7; } 50% { transform: translateX(4px); opacity: 1; } }

/* Deck footer */
.deck-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    flex-shrink: 0;
}
.nav-btn {
    flex: 1;
    max-width: 150px;
    border: none;
    border-radius: 14px;
    padding: 12px 10px;
    font-weight: 700;
    font-size: 0.74rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    cursor: pointer;
    transition: 0.2s;
    font-family: inherit;
}
.nav-btn:active { transform: scale(0.94); }
.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.nav-btn.prev {
    background: rgba(255, 255, 255, 0.08);
    color: #e2e8f0;
    border: 1px solid rgba(255, 255, 255, 0.1);
}
.nav-btn.flip-btn {
    background: rgba(251, 191, 36, 0.15);
    color: #fbbf24;
    border: 1px solid rgba(251, 191, 36, 0.3);
    flex: 0 0 70px;
    max-width: 70px;
}
.nav-btn.next {
    background: linear-gradient(135deg, #fbbf24, #d97706);
    color: #fff;
    box-shadow: 0 6px 18px rgba(245, 158, 11, 0.4);
}

/* Deck counter */
.counter-pill {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.66rem;
    font-weight: 800;
    padding: 5px 12px;
    border-radius: 20px;
    background: rgba(15, 23, 42, 0.7);
    backdrop-filter: blur(8px);
    color: #fde68a;
    letter-spacing: 0.5px;
    z-index: 6;
    pointer-events: none;
}

/* ══════════════════════════════════════════════════════
   Empty state / Loading
   ══════════════════════════════════════════════════════ */
.state-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    flex: 1;
    color: #cbd5e1;
}
.state-screen i.big-icon {
    font-size: 3.5rem;
    color: var(--amber);
    margin-bottom: 18px;
    opacity: 0.85;
}
.state-screen h2 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.2rem;
    font-weight: 800;
    color: #fff;
    margin-bottom: 8px;
}
.state-screen p {
    font-size: 0.85rem;
    line-height: 1.6;
    max-width: 340px;
    margin-bottom: 20px;
}
.state-screen code {
    background: rgba(255, 255, 255, 0.08);
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 0.82rem;
    color: #fbbf24;
    font-family: ui-monospace, monospace;
}

.spinner {
    width: 42px;
    height: 42px;
    border: 4px solid rgba(251, 191, 36, 0.25);
    border-top: 4px solid #fbbf24;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin-bottom: 16px;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* Empty filtered result */
.empty-filter {
    grid-column: 1 / -1;
    padding: 40px 20px;
    text-align: center;
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.83rem;
}
.empty-filter i { font-size: 2rem; color: var(--amber); opacity: 0.5; margin-bottom: 12px; display: block; }

/* Responsive tweaks */
@media (max-height: 700px) {
    .card { height: min(60vh, 440px); }
    .card-q { font-size: 0.95rem; }
    .card-face { padding: 20px 18px; }
}

/* Desktop nice-touches */
@media (min-width: 720px) {
    .app { border-radius: 24px; margin: 16px auto; height: calc(100dvh - 32px); box-shadow: 0 30px 80px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.06); }
}
</style>
</head>
<body>

<div class="app" id="app">

    <!-- ══════════════════════════════════════════════════
         HOME SCREEN
         ══════════════════════════════════════════════════ -->
    <div class="screen active" id="homeScreen">

        <div class="home-hero">
            <h1>All SAs Magic Book</h1>
            <p>CA Final Audit · CA Shankar Lakhwani · Q&amp;A Flashcards</p>

            <div class="stat-row">
                <div class="stat-chip">
                    <strong id="statChapters">0</strong>
                    <span>Chapters</span>
                </div>
                <div class="stat-chip">
                    <strong id="statCards">0</strong>
                    <span>Cards</span>
                </div>
                <div class="stat-chip">
                    <strong id="statDone">0</strong>
                    <span>Mastered</span>
                </div>
            </div>

            <div class="overall-bar"><div id="overallBar"></div></div>
            <div class="overall-row">
                <span id="overallText">Loading…</span>
                <span id="overallPct">0%</span>
            </div>
        </div>

        <div class="search-wrap">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search topics, SAs, keywords…" />
            </div>
        </div>

        <div class="filter-row" id="filterRow">
            <button class="filter-pill active" data-filter="all">All</button>
            <button class="filter-pill" data-filter="starred">★ Starred</button>
            <button class="filter-pill" data-filter="pending">Pending</button>
            <button class="filter-pill" data-filter="done">Done</button>
            <button class="filter-pill" data-filter="icai_tip">🔥 ICAI Tips</button>
            <button class="filter-pill" data-filter="case_question">❓ Case Qs</button>
            <button class="filter-pill" data-filter="chart">📊 Charts</button>
            <button class="filter-pill" data-filter="table">📋 Tables</button>
        </div>

        <div class="chapters-list" id="chaptersList">
            <div class="state-screen">
                <div class="spinner"></div>
                <p style="color:#94a3b8;">Loading magic book…</p>
            </div>
        </div>

        <div class="footer-credit">
            Made with ❤️ · Sourced from ICAI Module &amp; CA Shankar Lakhwani
        </div>
    </div>

    <!-- ══════════════════════════════════════════════════
         DECK SCREEN
         ══════════════════════════════════════════════════ -->
    <div class="screen" id="deckScreen" style="background: radial-gradient(circle at 50% 0%, #1e293b, #0b1120 65%);">

        <div class="deck-header">
            <button class="btn-back" id="btnBack"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="deck-title">
                <h3 id="deckTitle">Chapter</h3>
                <p id="deckSubtitle">0 / 0</p>
            </div>
            <button class="btn-icon" id="btnStarAll" title="Star current card">
                <i class="fa-regular fa-star" id="starIcon"></i>
            </button>
        </div>

        <div class="deck-progress"><div id="deckProgressFill"></div></div>

        <div class="stage" id="stage">
            <!-- Cards injected here -->
        </div>

        <div class="deck-footer">
            <button class="nav-btn prev" id="btnPrev"><i class="fa-solid fa-chevron-left"></i> Prev</button>
            <button class="nav-btn flip-btn" id="btnFlip"><i class="fa-solid fa-rotate"></i></button>
            <button class="nav-btn next" id="btnNext">Next <i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>

</div>

<script>
(function() {

    // ═══════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════
    const STATE = {
        chapters: [],
        current: {
            chapterIdx: -1,
            cards: [],
            idx: 0,
            filter: 'all',
            search: ''
        },
        // Persistence
        starred: new Set(),
        mastered: new Set(),
        lock: false
    };

    const STORE_STAR = 'magicBook_starred_v1';
    const STORE_DONE = 'magicBook_mastered_v1';

    // ═══════════════════════════════════════════════════
    // STORAGE
    // ═══════════════════════════════════════════════════
    function loadStore() {
        try { STATE.starred = new Set(JSON.parse(localStorage.getItem(STORE_STAR) || '[]')); } catch(e) {}
        try { STATE.mastered = new Set(JSON.parse(localStorage.getItem(STORE_DONE) || '[]')); } catch(e) {}
    }
    function saveStar() { try { localStorage.setItem(STORE_STAR, JSON.stringify([...STATE.starred])); } catch(e) {} }
    function saveDone() { try { localStorage.setItem(STORE_DONE, JSON.stringify([...STATE.mastered])); } catch(e) {} }

    // ═══════════════════════════════════════════════════
    // UTIL
    // ═══════════════════════════════════════════════════
    const $ = id => document.getElementById(id);
    const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function typeToClass(t) {
        if (t === 'case_question') return 't-case';
        if (t === 'icai_tip') return 't-icai';
        if (t === 'chart') return 't-chart';
        if (t === 'table') return 't-table';
        return '';
    }
    function typeLabel(t) {
        switch (t) {
            case 'case_question': return 'Case Question';
            case 'icai_tip': return '🔥 ICAI Tip';
            case 'chart': return 'Magic Chart';
            case 'table': return 'Table';
            default: return 'Concept';
        }
    }

    function chapterProgress(ch) {
        const done = ch.cards.filter(c => STATE.mastered.has(c.id)).length;
        return { done, total: ch.cards.length, pct: ch.cards.length ? Math.round(done / ch.cards.length * 100) : 0 };
    }

    function overallStats() {
        let total = 0, done = 0;
        STATE.chapters.forEach(ch => {
            total += ch.cards.length;
            done += ch.cards.filter(c => STATE.mastered.has(c.id)).length;
        });
        return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
    }

    // ═══════════════════════════════════════════════════
    // DATA LOAD
    // ═══════════════════════════════════════════════════
    async function loadData() {
        try {
            const res = await fetch('qa_magic_book.json', { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            let text = await res.text();
            // strip BOM
            if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
            const json = JSON.parse(text);

            STATE.chapters = (json.chapters || []).map(ch => ({
                ...ch,
                cards: ch.cards || []
            })).filter(ch => ch.cards.length > 0);

            // Stats
            const totalCards = STATE.chapters.reduce((a, c) => a + c.cards.length, 0);
            $('statChapters').textContent = STATE.chapters.length;
            $('statCards').textContent = totalCards;

            renderHomeStats();
            renderChapters();
        } catch (e) {
            console.error('[MagicBook] load failed:', e);
            $('chaptersList').innerHTML = `
                <div class="state-screen">
                    <i class="fa-solid fa-triangle-exclamation big-icon" style="color:#ef4444;"></i>
                    <h2>Could not load book</h2>
                    <p>Make sure <code>qa_magic_book.json</code> sits beside this HTML file, and open via <code>http://</code> or <code>https://</code> (not <code>file://</code>).</p>
                    <p style="font-size:0.75rem;opacity:0.7;">Error: ${esc(e.message)}</p>
                </div>`;
        }
    }

    // ═══════════════════════════════════════════════════
    // HOME RENDER
    // ═══════════════════════════════════════════════════
    function renderHomeStats() {
        const s = overallStats();
        $('statDone').textContent = s.done;
        $('overallBar').style.width = s.pct + '%';
        $('overallText').textContent = `${s.done} of ${s.total} cards mastered`;
        $('overallPct').textContent = s.pct + '%';
    }

    function renderChapters() {
        const filter = STATE.current.filter;
        const q = STATE.current.search.trim().toLowerCase();

        let visible = STATE.chapters.filter(ch => {
            // search match
            if (q) {
                const inTitle = ch.chapter_title.toLowerCase().includes(q);
                const inCards = ch.cards.some(c =>
                    (c.q || '').toLowerCase().includes(q) ||
                    (c.a_html || '').toLowerCase().includes(q)
                );
                if (!inTitle && !inCards) return false;
            }
            // type / status filter
            if (filter === 'starred') {
                return ch.cards.some(c => STATE.starred.has(c.id));
            }
            if (filter === 'pending') {
                return ch.cards.some(c => !STATE.mastered.has(c.id));
            }
            if (filter === 'done') {
                return chapterProgress(ch).pct === 100;
            }
            if (filter === 'icai_tip' || filter === 'case_question' || filter === 'chart' || filter === 'table') {
                return ch.cards.some(c => c.type === filter);
            }
            return true;
        });

        if (!visible.length) {
            $('chaptersList').innerHTML = `
                <div class="empty-filter">
                    <i class="fa-solid fa-inbox"></i>
                    No chapters match this filter.
                </div>`;
            return;
        }

        const html = visible.map(ch => {
            const origIdx = STATE.chapters.indexOf(ch);
            const p = chapterProgress(ch);
            const doneClass = p.pct === 100 ? 'done' : '';
            const cardCount = ch.cards.length;
            return `
                <div class="chapter-card ${doneClass}" data-ch="${origIdx}">
                    <div class="ch-num">${p.pct === 100 ? '<i class="fa-solid fa-check"></i>' : ch.chapter_number}</div>
                    <div class="ch-info">
                        <h4>${esc(ch.chapter_title)}</h4>
                        <div class="ch-meta">
                            <span>${cardCount} card${cardCount === 1 ? '' : 's'}</span>
                            <span class="dot"></span>
                            <span>${p.done} mastered</span>
                        </div>
                        <div class="ch-mini-bar"><div style="width:${p.pct}%"></div></div>
                    </div>
                    <i class="fa-solid fa-chevron-right ch-arrow"></i>
                </div>`;
        }).join('');

        $('chaptersList').innerHTML = html;

        // Bind
        document.querySelectorAll('.chapter-card').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.ch, 10);
                openChapter(idx);
            });
        });
    }

    // ═══════════════════════════════════════════════════
    // SCREEN SWITCH
    // ═══════════════════════════════════════════════════
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        $(id).classList.add('active');
    }

    // ═══════════════════════════════════════════════════
    // CHAPTER DECK
    // ═══════════════════════════════════════════════════
    function openChapter(idx) {
        const ch = STATE.chapters[idx];
        if (!ch) return;

        // Apply filter/search to this chapter's cards
        const q = STATE.current.search.trim().toLowerCase();
        const filter = STATE.current.filter;

        let cards = ch.cards.slice();
        if (q) {
            cards = cards.filter(c =>
                (c.q || '').toLowerCase().includes(q) ||
                (c.a_html || '').toLowerCase().includes(q)
            );
        }
        if (filter === 'starred') cards = cards.filter(c => STATE.starred.has(c.id));
        else if (filter === 'pending') cards = cards.filter(c => !STATE.mastered.has(c.id));
        else if (filter === 'done') cards = cards.filter(c => STATE.mastered.has(c.id));
        else if (filter === 'icai_tip' || filter === 'case_question' || filter === 'chart' || filter === 'table') {
            cards = cards.filter(c => c.type === filter);
        }

        if (!cards.length) {
            // Fallback to all cards
            cards = ch.cards.slice();
        }

        STATE.current.chapterIdx = idx;
        STATE.current.cards = cards;
        STATE.current.idx = 0;

        $('deckTitle').textContent = `Ch ${ch.chapter_number} · ${ch.chapter_title}`;
        updateDeckHeader();
        renderDeck();
        showScreen('deckScreen');
    }

    function updateDeckHeader() {
        const total = STATE.current.cards.length;
        const i = STATE.current.idx;
        $('deckSubtitle').textContent = `${Math.min(i + 1, total)} / ${total}`;
        $('deckProgressFill').style.width = total ? ((i / total) * 100) + '%' : '0%';

        const cur = STATE.current.cards[i];
        const starOn = cur && STATE.starred.has(cur.id);
        $('starIcon').className = starOn ? 'fa-solid fa-star' : 'fa-regular fa-star';
        $('starIcon').style.color = starOn ? '#fbbf24' : '';

        $('btnPrev').disabled = i === 0;
        $('btnNext').disabled = i >= total - 1;
    }

    // ═══════════════════════════════════════════════════
    // DECK RENDER
    // ═══════════════════════════════════════════════════
    function renderDeck() {
        const stage = $('stage');
        stage.innerHTML = '';

        const total = STATE.current.cards.length;
        if (!total) {
            stage.innerHTML = `<div class="state-screen"><i class="fa-solid fa-inbox big-icon"></i><h2>Empty deck</h2><p>No cards here.</p></div>`;
            return;
        }

        // Clamp idx
        if (STATE.current.idx >= total) STATE.current.idx = total - 1;
        if (STATE.current.idx < 0) STATE.current.idx = 0;

        // Render up to 3 stacked
        const maxK = Math.min(total - 1, STATE.current.idx + 2);
        for (let k = maxK; k >= STATE.current.idx; k--) {
            const c = STATE.current.cards[k];
            const off = k - STATE.current.idx;
            const isTop = off === 0;
            const isStarred = STATE.starred.has(c.id);
            const isDone = STATE.mastered.has(c.id);
            const typeCls = typeToClass(c.type);

            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.dataset.top = isTop ? '1' : '0';
            cardEl.style.zIndex = String(30 - off);
            cardEl.style.transform = `translate3d(0, ${off * 14}px, 0) scale(${1 - off * 0.06})`;
            cardEl.style.opacity = off > 1 ? '0' : '1';
            cardEl.style.pointerEvents = isTop ? 'auto' : 'none';

            const qMarkup = c.q_html || esc(c.q);
            const aMarkup = c.a_html || '<p style="opacity:0.6;">No answer content.</p>';

            cardEl.innerHTML = `
                <div class="card-inner">
                    <div class="card-face card-front ${typeCls}">
                        ${isTop ? '<div class="stamp stamp-yes">DONE</div><div class="stamp stamp-no">LATER</div>' : ''}
                        <div class="card-top">
                            <span class="card-badge">${typeLabel(c.type)}</span>
                            <span class="card-num-badge">#${k + 1}</span>
                            ${isTop ? `<button class="card-star ${isStarred ? 'active' : ''}" data-star="${esc(c.id)}" title="Star card">
                                <i class="${isStarred ? 'fa-solid' : 'fa-regular'} fa-star"></i>
                            </button>` : ''}
                        </div>
                        <div class="card-q">${qMarkup}</div>
                        <div class="card-hint">
                            <i class="fa-solid fa-hand-pointer"></i> Tap to reveal answer
                        </div>
                    </div>
                    <div class="card-face card-back">
                        <div class="back-head">
                            <div class="back-num">#${k + 1}</div>
                            <h4>${esc(c.q || 'Answer')}</h4>
                        </div>
                        <div class="card-answer">${aMarkup}</div>
                        <div class="back-hint">
                            ${isDone ? '✅ Marked as mastered · ' : ''}Tap to flip back
                        </div>
                    </div>
                </div>`;

            stage.appendChild(cardEl);

            if (isTop) {
                attachDrag(cardEl, c);
                // Tap to flip (but ignore when star clicked)
                cardEl.addEventListener('click', e => {
                    if (e.target.closest('.card-star')) return;
                    if (dragMovedRecently) return;
                    cardEl.classList.toggle('flipped');
                });
            }
        }

        // Swipe hint on first card of the deck
        if (STATE.current.idx === 0) {
            const hint = document.createElement('div');
            hint.className = 'swipe-hint';
            hint.innerHTML = `
                <span class="hint-l"><i class="fa-solid fa-arrow-left"></i></span>
                SWIPE TO NAVIGATE
                <span class="hint-r"><i class="fa-solid fa-arrow-right"></i></span>`;
            stage.appendChild(hint);
        }

        // Counter pill
        const counter = document.createElement('div');
        counter.className = 'counter-pill';
        counter.textContent = `${STATE.current.idx + 1} / ${total}`;
        stage.appendChild(counter);

        updateDeckHeader();
    }

    // ═══════════════════════════════════════════════════
    // SWIPE ENGINE
    // ═══════════════════════════════════════════════════
    let dragMovedRecently = false;

    function attachDrag(cardEl, cardData) {
        let sx = 0, sy = 0, dx = 0, dy = 0;
        let dragging = false, decided = false;
        let rafId = null;
        const BASE = 'translate3d(0,0,0) scale(1)';
        const yes = cardEl.querySelector('.stamp-yes');
        const no  = cardEl.querySelector('.stamp-no');

        function paint() {
            rafId = null;
            const rot = dx / 16;
            cardEl.style.transform = `translate3d(${dx}px, ${dy * 0.3}px, 0) rotate(${rot}deg)`;
            if (yes) yes.style.opacity = Math.max(0, Math.min(1, dx / 80));
            if (no)  no.style.opacity  = Math.max(0, Math.min(1, -dx / 80));
        }
        function reset() {
            cardEl.style.transition = 'transform .34s cubic-bezier(.16,1,.3,1), opacity .2s';
            cardEl.style.transform = BASE;
            if (yes) yes.style.opacity = 0;
            if (no)  no.style.opacity  = 0;
        }

        cardEl.addEventListener('pointerdown', e => {
            if (e.button && e.button !== 0) return;
            if (e.target.closest('.card-star')) return;
            dragging = true;
            decided = false;
            dx = 0; dy = 0;
            sx = e.clientX; sy = e.clientY;
            cardEl.style.transition = 'none';
            try { cardEl.setPointerCapture(e.pointerId); } catch(err) {}
        });

        cardEl.addEventListener('pointermove', e => {
            if (!dragging) return;
            dx = e.clientX - sx;
            dy = e.clientY - sy;
            if (!decided) {
                if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
                decided = true;
                if (Math.abs(dy) > Math.abs(dx)) { dragging = false; reset(); return; }
            }
            if (rafId) return;
            rafId = requestAnimationFrame(paint);
        });

        function finish() {
            if (!dragging) return;
            dragging = false;
            dragMovedRecently = true;
            setTimeout(() => dragMovedRecently = false, 250);
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            if (Math.abs(dx) > 85) {
                const dir = dx > 0; // right → prev, left → next
                cardEl.style.transition = 'transform .26s ease-out, opacity .26s ease-out';
                cardEl.style.transform = `translate3d(${dir ? 640 : -640}px, ${dy * 0.4}px, 0) rotate(${dir ? 26 : -26}deg)`;
                cardEl.style.opacity = '0';
                if (dir) {
                    // right swipe = master the card
                    markMastered(cardData.id, true);
                    setTimeout(() => goPrev(), 180);
                } else {
                    // left swipe = mark as "not yet"
                    markMastered(cardData.id, false);
                    setTimeout(() => goNext(), 180);
                }
            } else {
                dx = 0; dy = 0; reset();
            }
        }

        cardEl.addEventListener('pointerup', finish);
        cardEl.addEventListener('pointercancel', () => {
            dragging = false;
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            dx = 0; dy = 0; reset();
        });
    }

    // ═══════════════════════════════════════════════════
    // MASTER / STAR
    // ═══════════════════════════════════════════════════
    function markMastered(id, done) {
        if (done) STATE.mastered.add(id);
        else STATE.mastered.delete(id);
        saveDone();
    }
    function toggleStar(id) {
        if (STATE.starred.has(id)) STATE.starred.delete(id);
        else STATE.starred.add(id);
        saveStar();
    }

    // ═══════════════════════════════════════════════════
    // NAVIGATION
    // ═══════════════════════════════════════════════════
    function goNext() {
        if (STATE.current.idx < STATE.current.cards.length - 1) {
            STATE.current.idx++;
            renderDeck();
        }
    }
    function goPrev() {
        if (STATE.current.idx > 0) {
            STATE.current.idx--;
            renderDeck();
        }
    }

    // ═══════════════════════════════════════════════════
    // EVENT BINDINGS
    // ═══════════════════════════════════════════════════
    function bind() {
        $('btnBack').addEventListener('click', () => {
            showScreen('homeScreen');
            renderHomeStats();
            renderChapters();
        });

        $('btnPrev').addEventListener('click', goPrev);
        $('btnNext').addEventListener('click', goNext);

        $('btnFlip').addEventListener('click', () => {
            const top = document.querySelector('.card[data-top="1"]');
            if (top) top.classList.toggle('flipped');
        });

        $('btnStarAll').addEventListener('click', () => {
            const cur = STATE.current.cards[STATE.current.idx];
            if (!cur) return;
            toggleStar(cur.id);
            updateDeckHeader();
            // refresh star button class without full re-render
            const top = document.querySelector('.card[data-top="1"]');
            if (top) {
                const btn = top.querySelector('.card-star');
                if (btn) {
                    const on = STATE.starred.has(cur.id);
                    btn.classList.toggle('active', on);
                    btn.querySelector('i').className = on ? 'fa-solid fa-star' : 'fa-regular fa-star';
                }
            }
        });

        // Star clicks (delegated)
        document.addEventListener('click', e => {
            const btn = e.target.closest('.card-star');
            if (!btn) return;
            e.stopPropagation();
            const id = btn.dataset.star;
            if (!id) return;
            toggleStar(id);
            const on = STATE.starred.has(id);
            btn.classList.toggle('active', on);
            btn.querySelector('i').className = on ? 'fa-solid fa-star' : 'fa-regular fa-star';
            updateDeckHeader();
        });

        // Search
        let searchTimer = null;
        $('searchInput').addEventListener('input', e => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                STATE.current.search = e.target.value;
                if ($('deckScreen').classList.contains('active')) {
                    // Re-open chapter with new search
                    openChapter(STATE.current.chapterIdx);
                } else {
                    renderChapters();
                }
            }, 180);
        });

        // Filter pills
        document.querySelectorAll('.filter-pill').forEach(p => {
            p.addEventListener('click', () => {
                document.querySelectorAll('.filter-pill').forEach(x => x.classList.remove('active'));
                p.classList.add('active');
                STATE.current.filter = p.dataset.filter;
                if ($('deckScreen').classList.contains('active')) {
                    openChapter(STATE.current.chapterIdx);
                } else {
                    renderChapters();
                }
            });
        });

        // Keyboard nav
        document.addEventListener('keydown', e => {
            if (!$('deckScreen').classList.contains('active')) return;
            if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
            else if (e.key === ' ' || e.key === 'Enter') {
                const top = document.querySelector('.card[data-top="1"]');
                if (top) { e.preventDefault(); top.classList.toggle('flipped'); }
            }
            else if (e.key === 'Escape') { e.preventDefault(); $('btnBack').click(); }
        });
    }

    // ═══════════════════════════════════════════════════
    // BOOT
    // ═══════════════════════════════════════════════════
    loadStore();
    bind();
    loadData();

})();
</script>
</body>
</html>
